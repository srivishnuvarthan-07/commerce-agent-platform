<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password · Mall Order Agent</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="change-card">
  <div class="brand"><span class="brand-mark">OA</span><div><strong>Mall Order Agent</strong><span>Account Security</span></div></div>
  <h1>Change Password</h1>
  <p class="subtitle">An initial or temporary password must be changed before continuing</p>
  <form id="passwordForm">
    <div class="field"><label for="currentPassword">Current Password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="newPassword">New Password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div>
    <div class="field"><label for="confirmPassword">Confirm New Password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div>
    <p class="error" id="passwordError" role="alert"></p>
    <button class="primary" id="passwordButton" type="submit">Save &amp; Log In Again</button>
  </form>
</main>
<script src="/change-password.js" defer></script>
</body>
</html>
