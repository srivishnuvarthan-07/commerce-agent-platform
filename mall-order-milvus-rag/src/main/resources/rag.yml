# RAG config: Milvus vector store + document catalog
# Imported by application.yml via spring.config.import

spring:
  ai:
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:127.0.0.1}
          port: ${MILVUS_PORT:29530}
        collection-name: mall_rag_v5
        dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
        index-type: IVF_FLAT
        metric-type: COSINE
        # RagService owns the richer v4 schema; prevent the generic VectorStore schema racing it.
        initialize-schema: false

rag:
  data-dir: data
  collection-name: ${RAG_COLLECTION_NAME:mall_rag_v5}
  dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
  chunk:
    strategy: CONTENT_TYPE_AWARE
    max-num-chunks: 10000
    fixed-size:
      max-tokens: 250
    sliding-window:
      max-tokens: 250
      overlap-tokens: 50
    recursive:
      min-tokens: 80
      max-tokens: 400
      overlap-tokens: 40
    semantic:
      min-tokens: 100
      target-tokens: 250
      max-tokens: 500
      batch-size: 64
      max-sentences: 2000
      boundary-percentile: 0.85
    parent-child:
      parent-tokens: 800
      child-tokens: 200
      child-overlap-tokens: 40
  rerank:
    enabled: false
    model: ""
    base-url: ""
    candidate-multiplier: 1
    min-score: 0.0
    instruct: ""
  ask:
    model: mistral-small-latest
    temperature: 0.3
    context-top-k: 5
    prompt-version: v3
    system-prompt: |
      You are an enterprise knowledge base and business tool Q&A assistant.
      Answer questions strictly based on the "Tool Query Results" and "Reference Material" provided in the user message.
      Rules:
      1. If tool query results are provided, treat them as authoritative real-time business facts. Do not ignore or contradict any fields in them.
      2. Use only the reference material for rules, policies, and procedures. Do not fabricate information.
      3. If tool facts or reference material are insufficient, only state what is actually missing. Do not claim provided information is missing.
      4. Keep answers concise and accurate. Bullet points are acceptable.
      5. Do not reveal reference material section numbers or internal field names.
      6. When a tool result is marked as an "authoritative conclusion", do not use knowledge base content or model reasoning to modify, weaken, or override that conclusion.

  catalog:
    - filename: 01_HR员工手册.pdf
      department: HR
      role: hr
      version: "3.2"
    - filename: 02_财务制度.pdf
      department: Finance
      role: finance
      version: "2.1"
    - filename: 03_电商订单规则.pdf
      department: Operations
      role: public
      version: "5.1"
    - filename: 04_物流规则.pdf
      department: Logistics
      role: public
      version: "3.0"
    - filename: 05_客服处理手册.pdf
      department: CustomerService
      role: customer_service
      version: "4.1"
    - filename: 06_技术开发规范.pdf
      department: Engineering
      role: developer
      version: "2.4"
    - filename: 07_AI_Agent运维手册.pdf
      department: Platform
      role: admin
      version: "1.3"
    - filename: 08_销售业务手册.pdf
      department: Sales
      role: sales
      version: "1.0"
